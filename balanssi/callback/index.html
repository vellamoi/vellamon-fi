<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Balanssi – palataan sovellukseen</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #f5f7f6;
           color: #1c2b27; display: flex; min-height: 100vh; margin: 0;
           align-items: center; justify-content: center; text-align: center; }
    .card { max-width: 22rem; padding: 2rem; }
    a { color: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Palataan Balanssiin…</h1>
    <p id="msg">Viimeistellään pankkiyhteyttä.</p>
    <p><a id="manual" href="#">Jos et palaa automaattisesti, avaa Balanssi tästä.</a></p>
  </div>
  <script>
    // Staattinen redirect: lukee pankin palauttamat parametrit ja välittää ne
    // Balanssi-sovellukselle custom-skeemalla. Ei tallenna eikä lähetä mitään
    // muualle. Koodi on kertakäyttöinen ja hyödytön ilman sovelluksen avainta.
    (function () {
      var params = window.location.search || "";
      var target = "balanssi://openbanking-callback" + params;
      var link = document.getElementById("manual");
      link.href = target;
      if (!params) {
        document.getElementById("msg").textContent =
          "Tämä sivu avataan automaattisesti pankkitunnistautumisen jälkeen.";
        return;
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
